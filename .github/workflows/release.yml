name: release

# Tag `vMAJOR.MINOR.PATCH` (or run this by hand with a version) to build everything students need and leave it as a DRAFT release.
# Students and their launchers only see it once you press "Publish release" on GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, MAJOR.MINOR.PATCH (for example 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-x64, runner: windows-latest }
          - { os: macos-arm64, runner: macos-15 }
          - { os: macos-x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download the big datasets (release "datasets")
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download datasets --dir data-dl --pattern "*.xes"
      - name: Build the zip
        shell: bash
        env:
          RAW: ${{ inputs.version || github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}  # the runner's shared address is rate limited for anonymous API calls
        run: python build/build_runtime.py --os ${{ matrix.os }} --data-dir data-dl --out out --version "${RAW#v}" --build-id "${GITHUB_SHA::7}"
      - name: Check the Mac terminal installer (install.sh) installs a package that sets up and loads
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          HOME="$work/home" HS_DEST="$work/hs-marimo26" HS_NO_START=1 HS_PACKAGE_URL="$(ls "$GITHUB_WORKSPACE"/out/hs-marimo26-v*-${{ matrix.os }}.zip)" bash launcher/install.sh
          HOME="$work/home" HS_SETUP_ONLY=1 "$work/hs-marimo26/Start.command"
          "$work/home/Library/Application Support/hs-marimo26/runtime/python/bin/python3" -s -c "import msgspec, pandas, marimo; print('installed by install.sh: the native files load')"
      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.os }}
          path: out/*.zip
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
          path: out
      - name: Zip the notebooks (what running launchers fetch)
        run: python build/make_notebooks_zip.py --out out/notebooks.zip
      - name: Put the terminal installers next to the zips
        run: cp launcher/install.sh launcher/install.ps1 out/
      - name: Draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RAW: ${{ inputs.version || github.ref_name }}
        run: |
          V="${RAW#v}"
          cat > notes.md <<EOF
          Course notebooks $V.

          **Students:** paste one line into a terminal, once. It installs the course tools into your home folder and starts them (START-HERE.txt in that folder explains the rest). Later, double-click Start there.
          - Mac (Terminal): \`curl -fsSL https://github.com/alvarobernal2412/hs-marimo26/releases/latest/download/install.sh | bash\`
          - Windows (PowerShell): \`powershell -ExecutionPolicy Bypass -c "irm https://github.com/alvarobernal2412/hs-marimo26/releases/latest/download/install.ps1 | iex"\`


          The zips below are what the installer downloads; students do not download them by hand. \`notebooks.zip\` is fetched by running copies by themselves.
          EOF
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" out/* --clobber
          else
            gh release create "v$V" out/* --draft --title "v$V" --notes-file notes.md --target "$GITHUB_SHA"
          fi
