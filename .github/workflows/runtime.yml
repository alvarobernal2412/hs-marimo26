name: runtime build

# Builds the student zips (Python + packages + launcher + notebooks + datasets) for each operating system.
on:
  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime number N (the release is runtime-N)"
        required: true
        default: "1"
      notebooks:
        description: "Notebooks number the zip contains (notebooks-N)"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-x64, runner: windows-latest }
          - { os: macos-arm64, runner: macos-15 }
          - { os: macos-x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download the big datasets (release data-1)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data-1 --dir data-dl --pattern "*.xes"
      - name: Build the zip
        shell: bash
        run: python build/build_runtime.py --os ${{ matrix.os }} --data-dir data-dl --out out --runtime ${{ inputs.runtime }} --notebooks ${{ inputs.notebooks }}
      - name: Attach it to the release runtime-N
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "runtime-${{ inputs.runtime }}" >/dev/null 2>&1 || gh release create "runtime-${{ inputs.runtime }}" --title "runtime-${{ inputs.runtime }}" --notes "Student packages"
          gh release upload "runtime-${{ inputs.runtime }}" out/*.zip --clobber
